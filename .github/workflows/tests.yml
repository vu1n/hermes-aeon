name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        backend: [sqlite, libsql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - if: matrix.backend == 'libsql'
        run: python -m pip install 'libsql-experimental>=0.0.40'
      - name: Transaction, broker, projection and migration tests
        run: python -m unittest discover -s aeon_sharedwrites -v
      - name: Existing read adapter tests
        run: python -m unittest discover -s aeon_readonly -v
      - name: Plugin tests
        run: python -m pytest -q
