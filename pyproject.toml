[project]
name = "hermes-aeon"
version = "0.1.0"
description = "Aeon memory provider for Hermes-Agent."
requires-python = ">=3.10"
dependencies = [
    "libsql-experimental>=0.0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
