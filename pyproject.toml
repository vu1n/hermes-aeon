[project]
name = "hermes-aeon"
version = "0.3.0"
description = "Hermes plugin for Aeon Emerald: saves ended sessions as transcripts, plus the Oura and digest cron jobs."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
